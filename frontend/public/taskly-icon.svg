<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="taskly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Glowing icon container -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#taskly-grad)" filter="url(#shadow)"/>
  <!-- Checkmark / Task icon -->
  <path d="M160 256 L224 320 L352 192" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Minimal accent dot -->
  <circle cx="360" cy="150" r="18" fill="#38bdf8" />
</svg>
